# XcodeGen spec for the SmartBag iPhone app. The checked-in SmartBag.xcodeproj was generated from this
# file (xcodegen generate); regenerate after adding files: `xcodegen generate` in this folder.
name: SmartBag
options:
  bundleIdPrefix: space.mana
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "4"
targets:
  SmartBag:
    type: application
    platform: iOS
    sources:
      - path: SmartBag
    settings:
      base:
        PRODUCT_NAME: SmartBag
        PRODUCT_BUNDLE_IDENTIFIER: space.mana.smartbag
        INFOPLIST_FILE: SmartBag/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
    scheme: {}
